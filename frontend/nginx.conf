# Nginx config for the SCMS frontend container.
# Serves the React build on :3000 and proxies /api/* to the backend service.
#
# IMPORTANT: `backend` here is the docker-compose service name. Docker's internal DNS
# resolves it to the backend container's IP. Do NOT use localhost — that would point
# back to this nginx container.

server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Allow Excel / photo / medical-cert uploads up to 10 MB through the proxy.
    client_max_body_size 10M;

    # Backend API — proxy to the FastAPI container.
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Preserve auth cookies across the proxy hop
        proxy_pass_request_headers on;
        proxy_pass_header Set-Cookie;
        # Slow ops (Excel parse, large PDF generation, monthly digest) can take a while
        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        # Disable buffering for streaming responses (CSV export)
        proxy_buffering off;
    }

    # React SPA — single-page-app routing fallback
    location / {
        try_files $uri /index.html;
        # No caching on the entry point so deploys are picked up immediately
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Long-lived caching for hashed static assets emitted by `yarn build`
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
