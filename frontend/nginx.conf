server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html/public;
    index index.html;

    client_max_body_size 10M;

    location /api/ {
        proxy_pass https://ssms-backend.greenriver-9aa395cc.southindia.azurecontainerapps.io;
        proxy_http_version 1.1;
        proxy_set_header Host ssms-backend.greenriver-9aa395cc.southindia.azurecontainerapps.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
        proxy_pass_header Set-Cookie;
        proxy_connect_timeout 300s;
        proxy_send_timeout 4000s;
        proxy_read_timeout 4000s;
        proxy_buffering off;
        proxy_ssl_server_name on;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
