version: "3.9"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      MONGO_URL: "mongodb://mongo:27017"
      DB_NAME: "scms_db"
      JWT_SECRET: "${JWT_SECRET:-9f3b7e2a1c8d4e6f5a0b3c2d1e4f7a8b9c0d2e3f4a5b6c7d8e9f0a1b2c3d4e5f}"
      # Platform Super Admin credentials — provisioned once at startup. Override in your
      # .env or shell to set production values (e.g. `ADMIN_EMAIL=you@school.com docker compose up`).
      ADMIN_EMAIL: "${ADMIN_EMAIL:-jagadishchandu789@gmail.com}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-Manasa@123}"
      FRONTEND_URL: "http://localhost:3000"
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
    ports:
      - "8001:8001"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  mongo_data:
