version: "3.9"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      MONGO_URL: "mongodb://mongo:27017"
      DB_NAME: "scms_db"
      JWT_SECRET: "${JWT_SECRET:-9f3b7e2a1c8d4e6f5a0b3c2d1e4f7a8b9c0d2e3f4a5b6c7d8e9f0a1b2c3d4e5f}"
      # Platform Super Admin credentials — provisioned once at startup. Override in your
      # .env or shell to set production values (e.g. `ADMIN_EMAIL=you@school.com docker compose up`).
      ADMIN_EMAIL: "${ADMIN_EMAIL:-jagadishchandu789@gmail.com}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-Manasa@123}"
      FRONTEND_URL: "http://localhost:3000"
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      # Feature gates (default off; flip to "true" in your env to enable)
      ENABLE_DIGEST_SCHEDULER: "${ENABLE_DIGEST_SCHEDULER:-false}"
      ENABLE_SUBSCRIPTION_GUARD: "${ENABLE_SUBSCRIPTION_GUARD:-true}"
      SUBSCRIPTION_GRACE_DAYS: "${SUBSCRIPTION_GRACE_DAYS:-3}"
      # Twilio (optional — leave blank to keep notifications queued)
      TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID:-}"
      TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN:-}"
      TWILIO_WHATSAPP_FROM: "${TWILIO_WHATSAPP_FROM:-}"
      # Azure Blob storage (optional — leave blank to use in-DB base64 storage)
      AZURE_STORAGE_CONNECTION_STRING: "${AZURE_STORAGE_CONNECTION_STRING:-}"
      AZURE_STORAGE_CONTAINER: "${AZURE_STORAGE_CONTAINER:-}"
      AZURE_STORAGE_ACCOUNT_URL: "${AZURE_STORAGE_ACCOUNT_URL:-}"
      # SMTP — provider-agnostic email channel for digests and other notifications.
      # Leave SMTP_HOST blank to keep email notifications queued.
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      SMTP_USE_SSL: "${SMTP_USE_SSL:-false}"
    ports:
      - "8001:8001"

  frontend:
    build:
      context: ./frontend
      args:
        # The React build bakes this in at build time. Set it to your public API URL.
        # For local docker-compose, the nginx config also proxies /api/* to the backend service.
        REACT_APP_BACKEND_URL: "${REACT_APP_BACKEND_URL:-}"
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  mongo_data:
