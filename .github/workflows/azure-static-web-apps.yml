name: Deploy SCMS frontend to Azure Static Web Apps

# Trigger on every push to main + on pull-requests (PRs get free preview environments)
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  # --------------------------------------------------------------------------
  # Build the React app and deploy it. SWA's official action handles both.
  # --------------------------------------------------------------------------
  build_and_deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Setup Node 20 (matches frontend/Dockerfile)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock

      - name: Build and Deploy to Azure Static Web Apps
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          # ----------------------------------------------------------------
          # SWA deployment token — set this in:
          #   Repo → Settings → Secrets and variables → Actions
          # The exact secret name is auto-generated by `az staticwebapp create`,
          # but `AZURE_STATIC_WEB_APPS_API_TOKEN` is the conventional one to
          # rename to. Update the line below if your secret has a different name.
          # ----------------------------------------------------------------
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"

          # Frontend source lives under /frontend in this monorepo
          app_location: "/frontend"
          # `yarn build` writes here (Create React App default)
          output_location: "build"
          # No serverless API — backend is on Container Apps
          api_location: ""

          # Have SWA run our build instead of relying on auto-detection.
          # `--frozen-lockfile` ensures reproducible installs.
          app_build_command: "yarn install --frozen-lockfile && yarn build"
        env:
          # ----------------------------------------------------------------
          # Backend URL baked into the React bundle.
          # Set this secret in: Repo → Settings → Secrets and variables → Actions
          #   name : REACT_APP_BACKEND_URL
          #   value: https://scms-backend.<id>.<region>.azurecontainerapps.io
          #
          # Tip: if you're using the /api reverse-proxy in staticwebapp.config.json,
          # leave this empty ("") so axios uses relative `/api` paths and stays
          # same-origin (no CORS).
          # ----------------------------------------------------------------
          REACT_APP_BACKEND_URL: ${{ secrets.REACT_APP_BACKEND_URL }}
          # Disable Create React App's "treat warnings as errors" in CI so a
          # stray ESLint warning doesn't block a deploy.
          CI: "false"

  # --------------------------------------------------------------------------
  # Auto-teardown of preview environments when a PR is closed
  # --------------------------------------------------------------------------
  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
